[package]
name = "sulafat-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Fidelity-preserving ~/.ssh/config engine for Sulafat, independent of any GUI toolkit"

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "1"
directories = "6"
notify = "6"
glob = "0.3"
tracing = "0.1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
